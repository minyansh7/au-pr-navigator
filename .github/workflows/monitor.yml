name: Daily Monitoring Update

on:
  schedule:
    - cron: '0 23 * * *'   # 9:00 AM AEST (UTC+10) every day
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

permissions:
  contents: write           # needed to commit monitoring_data.json back to repo

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install anthropic

      - name: Run monitoring
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_monitoring.py

      - name: Commit updated data
        run: |
          git config user.name  "AU/PR Monitor"
          git config user.email "monitor@noreply.github.com"
          git add monitoring_data.json au_pr_strategy.html
          git diff --staged --quiet && echo "No changes." || \
            git commit -m "chore: monitoring update $(date -u +'%Y-%m-%d')" && git push
